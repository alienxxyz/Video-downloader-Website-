<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlienX - Media Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #21262d;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-transform: uppercase;
        }
        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 20px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        button {
            background-color: #38bdf8;
            color: #0d1117;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #statusMessage {
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">AlienX</div>
    </header>
    <main>
        <div class="card">
            <h2>Video Downloader Tool</h2>
            <p>Paste the Instagram video link below:</p>
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="https://www.instagram.com/reel/...">
                <button onclick="downloadVideo()">Download</button>
            </div>
            <div id="statusMessage"></div>
        </div>
    </main>
    <script>
        async function downloadVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = '';

            if (!urlInput) {
                statusMessage.style.color = '#f87171';
                statusMessage.textContent = 'Please enter a valid URL.';
                return;
            }

            statusMessage.style.color = '#38bdf8';
            statusMessage.textContent = 'Processing...';

            try {
                const response = await fetch('https://co.wuk.sh/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        vQuality: '720'
                    })
                });

                const data = await response.json();

                if (data.url) {
                    statusMessage.style.color = '#4ade80';
                    statusMessage.textContent = 'Download starting...';
                    window.location.href = data.url;
                } else {
                    statusMessage.style.color = '#f87171';
                    statusMessage.textContent = 'Failed to fetch video. Try another link.';
                }
            } catch (error) {
                statusMessage.style.color = '#f87171';
                statusMessage.textContent = 'Network error. Please try again.';
            }
        }
    </script>
</body>
</html>
